# Bali on the shared Hetzner host. Two services: Postgres + the app (WhatsApp webhook, forms, enquiry chat, dashboard).
# Secrets live in /opt/bali/.env on the server only. No n8n, no PostgREST, no Gotenberg (retired 2026-11-23).
name: bali
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 400m
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U n8n"], interval: 5s, retries: 20}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  app:
    build: ./app
    restart: unless-stopped
    mem_limit: 256m
    ports: ["127.0.0.1:21102:3000"]
    environment:
      DB_HOST: postgres
      DB_USER: n8n
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: bali
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      BALI_FORWARD_SECRET: ${BALI_FORWARD_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_CONTRACT_CODE: ${MONNIFY_CONTRACT_CODE:-}
      MONNIFY_BASE_URL: ${MONNIFY_BASE_URL:-https://api.monnify.com}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      REMINDER_TEMPLATE: ${REMINDER_TEMPLATE:-bali_reservation_reminder}
      OPENAI_API_KEY: ${OPENAI_API_KEY_WORKING:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FLOW_PRIVATE_KEY_FILE: /keys/flow_private.pem
    volumes: ["/opt/bali/keys:/keys:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

volumes:
  pg_data:
  n8n_data:
  sop_uploads:
