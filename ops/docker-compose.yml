# Bali stack on the shared Hetzner host (77.42.122.241). Rebuilt 2026-11-22.
# Host ports bound to 127.0.0.1 only; shared-caddy routes the domains in.
name: bali
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 400m
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s
      retries: 20
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  postgrest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    mem_limit: 160m
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD}@postgres:5432/bali
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    ports: ["127.0.0.1:21101:3000"]
    depends_on: {postgres: {condition: service_healthy}}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    mem_limit: 1000m
    ports: ["127.0.0.1:21100:5678"]
    environment:
      NODE_OPTIONS: --max-old-space-size=800
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_HOST: n8n.erasystems.com.ng
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.erasystems.com.ng/
      WEBHOOK_URL: https://n8n.erasystems.com.ng/
      N8N_BASE_URL: https://n8n.erasystems.com.ng
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Africa/Lagos
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      SUPABASE_URL: https://bali.erasystems.com.ng
      SUPABASE_SERVICE_KEY: ${SERVICE_KEY}
      GOTENBERG_URL: http://gotenberg:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      BALI_FORWARD_SECRET: ${BALI_FORWARD_SECRET}
    volumes: [n8n_data:/home/node/.n8n]
    depends_on: {postgres: {condition: service_healthy}}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    mem_limit: 160m
    ports: ["127.0.0.1:21102:3000"]
    environment:
      DB_HOST: postgres
      DB_USER: n8n
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: bali
      SESSION_SECRET: ${SESSION_SECRET}
      N8N_PUBLIC_URL: https://n8n.erasystems.com.ng
    volumes: [sop_uploads:/data/sop-uploads]
    depends_on: {postgres: {condition: service_healthy}}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

volumes:
  pg_data:
  n8n_data:
  sop_uploads:
