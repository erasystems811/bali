<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bali — Sandbox</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    margin: 0;
    background: #12151a;
    color: #e6e8eb;
  }
  header {
    padding: 14px 18px;
    background: #1b1f26;
    border-bottom: 1px solid #2a2f38;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: #8b93a1; font-size: 12px; }
  .spacer { flex: 1; }
  button {
    background: #2a5bd7;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button.secondary { background: #3a3f4a; }
  button.danger { background: #7a2323; }
  button:hover { filter: brightness(1.1); }
  #addForm {
    display: none;
    padding: 12px 18px;
    background: #1b1f26;
    border-bottom: 1px solid #2a2f38;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  #addForm.open { display: flex; }
  #addForm input, #addForm select {
    background: #12151a;
    border: 1px solid #2a2f38;
    color: #e6e8eb;
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  #board {
    display: flex;
    gap: 12px;
    padding: 14px;
    overflow-x: auto;
    height: calc(100vh - 60px);
  }
  #board.with-form { height: calc(100vh - 108px); }
  .empty {
    color: #6b7280;
    padding: 40px;
    text-align: center;
    width: 100%;
  }
  .col {
    min-width: 300px;
    max-width: 320px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    background: #191d24;
    border: 1px solid #262b33;
    border-radius: 10px;
    overflow: hidden;
  }
  .col .head {
    padding: 10px 12px;
    background: #20252d;
    border-bottom: 1px solid #262b33;
  }
  .col .head .name { font-weight: 600; font-size: 14px; }
  .col .head .meta { font-size: 11px; color: #8b93a1; margin-top: 2px; }
  .col .badge {
    display: inline-block;
    font-size: 10px;
    background: #2a5bd7;
    color: white;
    padding: 1px 7px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .col .msgs {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 260px;
  }
  .bubble {
    max-width: 88%;
    padding: 7px 10px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.35;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.me { align-self: flex-end; background: #2a5bd7; color: white; }
  .bubble.bot { align-self: flex-start; background: #2a2f38; color: #e6e8eb; position: relative; }
  .bubble .kind { display: block; font-size: 10px; opacity: 0.7; margin-top: 3px; }
  .bubble .replyBtn {
    display: none;
    position: absolute;
    top: -9px;
    right: -9px;
    background: #3a3f4a;
    color: #e6e8eb;
    border: 1px solid #262b33;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .bubble.bot:hover .replyBtn { display: block; }
  .col .replyBanner {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: #20252d;
    border-top: 1px solid #262b33;
    font-size: 11px;
    color: #8b93a1;
  }
  .col .replyBanner.open { display: flex; }
  .col .replyBanner .snippet {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #c3c8d1;
  }
  .col .replyBanner button {
    background: none;
    border: none;
    color: #8b93a1;
    font-size: 13px;
    padding: 0 4px;
    cursor: pointer;
  }
  .col .inputRow {
    display: flex;
    gap: 6px;
    padding: 8px;
    border-top: 1px solid #262b33;
  }
  .col .inputRow input {
    flex: 1;
    background: #12151a;
    border: 1px solid #2a2f38;
    color: #e6e8eb;
    padding: 7px 9px;
    border-radius: 6px;
    font-size: 13px;
  }
  .col .inputRow button { padding: 7px 12px; }
  .col .inputRow .attachBtn {
    background: #3a3f4a;
    padding: 7px 10px;
  }
  .bubble .media {
    display: block;
    font-size: 11px;
    opacity: 0.85;
    margin-top: 2px;
  }
</style>
</head>
<body>
<header>
  <h1>Bali — Sandbox</h1>
  <span class="sub">Fake people, fake phone numbers, nothing real ever leaves this page.</span>
  <div class="spacer"></div>
  <button id="toggleAdd" class="secondary">+ Add persona</button>
  <button id="undoBtn" class="secondary">Undo</button>
  <span class="sub" id="undoCount"></span>
  <button id="resetBtn" class="danger">Reset sandbox</button>
</header>

<div id="addForm">
  <input id="newName" placeholder="Name (e.g. Test Customer)" />
  <select id="newRole"><option>loading roles…</option></select>
  <button id="createPersona">Create</button>
</div>

<div id="board"><div class="empty">Loading…</div></div>

<script>
const state = { personas: [], since: new Date(0).toISOString(), actionLog: [] };

async function api(path, opts) {
  const res = await fetch(path, opts);
  return res.json();
}

async function loadRoles() {
  const data = await api('sandbox-roles');
  const sel = document.getElementById('newRole');
  sel.innerHTML = (data.roles || []).map(r => `<option value="${r}">${r}</option>`).join('');
}

async function loadPersonas() {
  const data = await api('sandbox-personas');
  state.personas = data.personas || [];
  renderBoard();
}

function renderBoard() {
  const board = document.getElementById('board');
  if (!state.personas.length) {
    board.innerHTML = '<div class="empty">No personas yet — add one above to start testing (a customer, a PM, a lawyer, anyone).</div>';
    return;
  }
  const existingIds = new Set([...board.querySelectorAll('.col')].map(c => c.dataset.id));
  for (const p of state.personas) {
    if (existingIds.has(p.id)) continue;
    const col = document.createElement('div');
    col.className = 'col';
    col.dataset.id = p.id;
    col.dataset.phone = p.phone_number;
    col.innerHTML = `
      <div class="head">
        <span class="name">${escapeHtml(p.name || '(unnamed)')}</span><span class="badge">${escapeHtml(p.role)}</span>
        <div class="meta">${escapeHtml(p.phone_number)}</div>
      </div>
      <div class="msgs"></div>
      <div class="replyBanner">
        <span class="snippet"></span>
        <button class="cancelReply" title="Cancel reply">✕</button>
      </div>
      <div class="inputRow">
        <input placeholder="Type as ${escapeHtml(p.name || p.role)}…" />
        <button class="attachBtn" title="Send a receipt/image or document">📎</button>
        <input type="file" class="fileInput" accept="image/*,application/pdf" style="display:none" />
        <button class="sendBtn">Send</button>
      </div>`;
    board.appendChild(col);
    const input = col.querySelector('input');
    const send = () => sendAs(p, input);
    col.querySelector('.sendBtn').addEventListener('click', send);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    col.querySelector('.cancelReply').addEventListener('click', () => clearReply(col));
    const fileInput = col.querySelector('.fileInput');
    col.querySelector('.attachBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) sendMediaAs(p, fileInput.files[0]);
      fileInput.value = '';
    });
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function appendBubble(personaId, side, text, kind, messageId) {
  const col = document.querySelector(`.col[data-id="${personaId}"]`);
  if (!col) return;
  const msgs = col.querySelector('.msgs');
  const b = document.createElement('div');
  b.className = `bubble ${side}`;
  b.textContent = text;
  if (kind && kind !== 'text') {
    const k = document.createElement('span');
    k.className = 'kind';
    k.textContent = `(${kind})`;
    b.appendChild(k);
  }
  // Only bot bubbles are reply targets -- matches the real flow, where a
  // swipe-reply always answers a question the bot asked, never something
  // the sender typed themselves.
  if (side === 'bot' && messageId) {
    const replyBtn = document.createElement('button');
    replyBtn.className = 'replyBtn';
    replyBtn.title = 'Reply to this message';
    replyBtn.textContent = '↩';
    replyBtn.addEventListener('click', () => setReply(col, messageId, text));
    b.appendChild(replyBtn);
  }
  msgs.appendChild(b);
  msgs.scrollTop = msgs.scrollHeight;
}

function setReply(col, messageId, text) {
  col.dataset.replyToId = messageId;
  const banner = col.querySelector('.replyBanner');
  banner.querySelector('.snippet').textContent = `Replying to: ${text}`;
  banner.classList.add('open');
  col.querySelector('.inputRow input').focus();
}

function clearReply(col) {
  delete col.dataset.replyToId;
  col.querySelector('.replyBanner').classList.remove('open');
}

async function sendAs(persona, input) {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const col = document.querySelector(`.col[data-id="${persona.id}"]`);
  const replyToMessageId = col?.dataset.replyToId || '';

  // Record exactly how many bubbles every column had right before this
  // action, so undo can trim each column back to precisely that count --
  // never touching a persona's history that this action didn't add to.
  const preCounts = {};
  for (const c of document.querySelectorAll('.col')) {
    preCounts[c.dataset.id] = c.querySelector('.msgs').children.length;
  }
  state.actionLog.push({ kind: 'send', preCounts });

  appendBubble(persona.id, 'me', text);
  if (col) clearReply(col);
  await api('sandbox-send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone_number: persona.phone_number, text, reply_to_message_id: replyToMessageId }),
  });
  // Poll immediately (don't wait for the 2s interval) so any bot replies
  // this action produced are already on screen -- and therefore already
  // counted -- before the user has a chance to click Undo.
  await poll();
  await refreshUndoCount();
}

// Simulates sending a receipt/image or document -- no real file upload, the
// filename and type are all that ever reaches the bot (it never inspects
// media content either way, see sandbox-send-code.js). Same pattern as
// sendAs otherwise: swipe-reply-equivalent, undo snapshot, immediate poll.
async function sendMediaAs(persona, file) {
  const col = document.querySelector(`.col[data-id="${persona.id}"]`);
  const replyToMessageId = col?.dataset.replyToId || '';
  const mediaType = file.type.startsWith('image/') ? 'image' : 'document';

  const preCounts = {};
  for (const c of document.querySelectorAll('.col')) {
    preCounts[c.dataset.id] = c.querySelector('.msgs').children.length;
  }
  state.actionLog.push({ kind: 'send', preCounts });

  appendBubble(persona.id, 'me', `📎 ${file.name}`, mediaType);
  if (col) clearReply(col);
  await api('sandbox-send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone_number: persona.phone_number, media_type: mediaType, filename: file.name, reply_to_message_id: replyToMessageId }),
  });
  await poll();
  await refreshUndoCount();
}

let pollInFlight = false;
async function poll() {
  // The 2s interval timer and the explicit post-send poll() call (added so
  // a just-sent action's replies are on screen before Undo can be clicked)
  // can overlap. Without this guard, two concurrent calls both read the
  // same stale state.since, both fetch the same "new since X" batch, and
  // both render it -- the exact double/triple-bubble bug reported live.
  if (pollInFlight) return;
  pollInFlight = true;
  try {
    const data = await api(`sandbox-poll?since=${encodeURIComponent(state.since)}`);
    for (const m of (data.messages || [])) {
      const persona = state.personas.find(p => p.phone_number === m.to_number);
      if (persona) appendBubble(persona.id, 'bot', m.message_text, m.kind, m.message_id);
    }
    if (data.polled_at) state.since = data.polled_at;
  } catch (e) { /* transient network hiccup -- next poll will retry */ }
  finally { pollInFlight = false; }
}

document.getElementById('toggleAdd').addEventListener('click', () => {
  document.getElementById('addForm').classList.toggle('open');
  document.getElementById('board').classList.toggle('with-form');
});

document.getElementById('createPersona').addEventListener('click', async () => {
  const name = document.getElementById('newName').value.trim();
  const role = document.getElementById('newRole').value;
  if (!name || !role) return;
  const result = await api('sandbox-persona', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, role }),
  });
  if (result.persona?.id) state.actionLog.push({ kind: 'persona', personaId: result.persona.id });
  document.getElementById('newName').value = '';
  await loadPersonas();
  await refreshUndoCount();
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!confirm('Wipe every fake persona, booking, and message in the sandbox? This cannot be undone.')) return;
  await api('sandbox-reset', { method: 'POST' });
  document.getElementById('board').innerHTML = '';
  state.since = new Date(0).toISOString();
  await loadPersonas();
  await refreshUndoCount();
});

async function refreshUndoCount() {
  const data = await api('sandbox-undo-count');
  const label = document.getElementById('undoCount');
  const count = data.count || 0;
  label.textContent = count > 0 ? `${count} step${count === 1 ? '' : 's'} to undo` : 'nothing to undo';
  document.getElementById('undoBtn').disabled = count === 0;
}

document.getElementById('undoBtn').addEventListener('click', async () => {
  const btn = document.getElementById('undoBtn');
  if (btn.disabled) return; // ignore double-clicks while one undo is still in flight
  btn.disabled = true;
  const label = document.getElementById('undoCount');
  try {
    const result = await api('sandbox-undo', { method: 'POST' });
    if (!result.ok) {
      label.textContent = result.message || 'Nothing to undo.';
      return;
    }
    // Undo exactly what this one action added -- and nothing else on
    // screen. No full-board rebuild: that would wipe every persona's typed
    // ("me") messages, since those only ever exist client-side and can't be
    // reconstructed from the server. Trim precisely back to the bubble
    // counts recorded right before the action ran, or drop the one column
    // a persona-create action added.
    const action = state.actionLog.pop();
    if (action?.kind === 'persona') {
      const col = document.querySelector(`.col[data-id="${action.personaId}"]`);
      if (col) col.remove();
      state.personas = state.personas.filter((p) => p.id !== action.personaId);
    } else if (action?.kind === 'send') {
      for (const [personaId, count] of Object.entries(action.preCounts)) {
        const col = document.querySelector(`.col[data-id="${personaId}"]`);
        if (!col) continue;
        const msgs = col.querySelector('.msgs');
        while (msgs.children.length > count) msgs.removeChild(msgs.lastChild);
      }
    }
    // else: no client-side action log entry (e.g. page was reloaded after
    // the action ran) -- the server state is still correctly rolled back,
    // it just can't be reflected on screen without a page reload.
    label.textContent = `Undone: ${result.undone}`;
  } finally {
    await refreshUndoCount();
  }
});

(async function init() {
  await loadRoles();
  await loadPersonas();
  await refreshUndoCount();
  setInterval(poll, 2000);
  setInterval(refreshUndoCount, 5000);
})();
</script>
</body>
</html>
